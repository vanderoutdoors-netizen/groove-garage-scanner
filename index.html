<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Groove Garage — Scanner</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f0f14; --surface:#1a1a24; --surface2:#22222f; --border:#2e2e3f;
  --gold:#c9952a; --text:#e8e8f0; --dim:#888899; --green:#3ac97a; --red:#c93a3a; --radius:12px;
}
html,body { min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.header { background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
.header-title { font-family:Georgia,serif; font-size:18px; font-weight:bold; color:var(--gold); }
.header-sub { font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
.header-count { font-size:13px; color:var(--dim); }
.header-count span { color:var(--gold); font-weight:700; font-size:18px; }
.main { padding:16px; }
.viewfinder-wrap { position:relative; background:#000; border-radius:var(--radius);
  overflow:hidden; margin-bottom:14px; aspect-ratio:4/3; }
#preview { width:100%; height:100%; object-fit:cover; display:block; }
.scan-overlay { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none; }
.scan-frame { width:70%; max-width:260px; height:100px; position:relative; }
.scan-frame::before,.scan-frame::after,.scan-frame>span::before,.scan-frame>span::after {
  content:''; position:absolute; width:22px; height:22px; border-color:var(--gold); border-style:solid; }
.scan-frame::before    { top:0;    left:0;  border-width:3px 0 0 3px; }
.scan-frame::after     { top:0;    right:0; border-width:3px 3px 0 0; }
.scan-frame>span::before { bottom:0; left:0;  border-width:0 0 3px 3px; }
.scan-frame>span::after  { bottom:0; right:0; border-width:0 3px 3px 0; }
.scan-line { position:absolute; left:4px; right:4px; height:2px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  animation:scanline 1.8s ease-in-out infinite; }
@keyframes scanline { 0%{top:6px} 50%{top:90px} 100%{top:6px} }
.scan-status { position:absolute; top:10px; left:0; right:0;
  text-align:center; font-size:12px; color:rgba(255,255,255,0.8);
  background:rgba(0,0,0,0.4); padding:3px 0; }
.flash { position:absolute; inset:0; background:rgba(58,201,122,0.3);
  opacity:0; pointer-events:none; transition:opacity 0.15s; }
.flash.show { opacity:1; }
.start-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.75);
  display:flex; align-items:center; justify-content:center; border-radius:var(--radius); }
.btn-start { background:var(--gold); border:none; border-radius:var(--radius);
  color:#1a1008; font-size:17px; font-weight:700; padding:16px 32px; cursor:pointer; }
.or-divider { display:flex; align-items:center; gap:10px; margin:10px 0;
  color:var(--dim); font-size:12px; }
.or-divider::before,.or-divider::after { content:''; flex:1; height:1px; background:var(--border); }
.manual-row { display:flex; gap:8px; margin-bottom:14px; }
.manual-row input { flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:16px; padding:11px 13px; -webkit-appearance:none; }
.manual-row input:focus { outline:none; border-color:var(--gold); }
.btn-lookup { background:var(--surface2); border:1px solid var(--gold); border-radius:8px;
  color:var(--gold); font-size:14px; font-weight:700; padding:11px 14px; cursor:pointer; white-space:nowrap; }
.status-bar { display:none; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; font-size:13px; color:var(--dim);
  margin-bottom:14px; text-align:center; }
.status-bar.show { display:block; }
.status-bar.found { border-color:var(--green); color:var(--green); }
.status-bar.notfound { border-color:var(--red); color:var(--red); }
.form-card { background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:14px; display:none; }
.form-card.show { display:block; }
.form-title { font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; }
.field { margin-bottom:11px; }
.field label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px; }
.field input,.field select { width:100%; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:16px; padding:10px 12px; -webkit-appearance:none; }
.field input:focus,.field select:focus { outline:none; border-color:var(--gold); }
select option { background:var(--surface2); }
.genre-auto { font-size:11px; color:var(--green); margin-top:3px; }
.btn-save { width:100%; background:var(--gold); border:none; border-radius:var(--radius);
  color:#1a1008; font-size:17px; font-weight:700; padding:14px; cursor:pointer; margin-top:4px; }
.btn-save:active { opacity:0.85; }
.btn-save.saving { opacity:0.6; pointer-events:none; }
.btn-clear { width:100%; background:none; border:1px solid var(--border); border-radius:var(--radius);
  color:var(--dim); font-size:14px; padding:11px; cursor:pointer; margin-top:8px; }
.debug-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px; margin-bottom:12px; font-size:12px; font-family:monospace; color:var(--dim); display:none; }
.debug-box.show { display:block; }
.btn-debug { width:100%; background:none; border:1px solid var(--border); border-radius:8px;
  color:var(--dim); font-size:12px; padding:8px; cursor:pointer; margin-bottom:12px; }
.section-title { font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin:14px 0 10px; }
.history-card { background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:11px 13px; margin-bottom:8px; }
.history-artist { font-weight:700; font-size:14px; }
.history-title  { font-size:13px; color:var(--dim); margin-top:2px; }
.history-meta   { font-size:11px; color:var(--dim); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; }
.toast { position:fixed; bottom:20px; left:14px; right:14px; background:var(--surface);
  border:1px solid var(--green); border-radius:var(--radius); padding:12px 16px;
  font-size:14px; color:var(--green); text-align:center; opacity:0; transform:translateY(8px);
  transition:opacity 0.2s,transform 0.2s; z-index:100; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.error { border-color:var(--red); color:var(--red); }
.spin { display:inline-block; width:13px; height:13px; border:2px solid var(--border);
  border-top-color:var(--gold); border-radius:50%; animation:spin 0.5s linear infinite;
  vertical-align:middle; margin-right:5px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Groove Garage</div>
    <div class="header-sub">CD Scanner</div>
  </div>
  <div class="header-count">Session: <span id="sessionCount">0</span></div>
</div>

<div class="main">
  <div class="viewfinder-wrap">
    <video id="preview" autoplay playsinline muted></video>
    <div class="scan-status" id="scanStatus">Tap Start Camera</div>
    <div class="scan-overlay">
      <div class="scan-frame"><span></span><div class="scan-line"></div></div>
    </div>
    <div class="flash" id="flash"></div>
    <div class="start-overlay" id="startOverlay">
      <button class="btn-start" onclick="startCamera()">📷 Start Camera</button>
    </div>
  </div>

  <div class="or-divider">or enter barcode manually</div>
  <div class="manual-row">
    <input type="text" id="barcodeInput" placeholder="Type UPC…" inputmode="numeric"
           onkeydown="if(event.key==='Enter') doLookup(this.value)">
    <button class="btn-lookup" onclick="doLookup(document.getElementById('barcodeInput').value)">Look Up</button>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="form-card" id="formCard">
    <div class="form-title">Confirm &amp; Save</div>
    <div class="field"><label>Artist *</label>
      <input type="text" id="fArtist" placeholder="Artist" oninput="triggerGenre()"></div>
    <div class="field"><label>Title *</label>
      <input type="text" id="fTitle" placeholder="Album title"></div>
    <div class="field"><label>Label</label>
      <input type="text" id="fLabel" placeholder="Record label"></div>
    <div class="field"><label>Year</label>
      <input type="number" id="fYear" placeholder="e.g. 1994" inputmode="numeric"></div>
    <div class="field"><label>Genre</label>
      <select id="fGenre">
        <option value="">— detecting… —</option>
        <option>Classic Rock</option><option>Hard Rock & Metal</option>
        <option>Alternative & Modern Rock</option><option>Folk & Singer-Songwriter</option>
        <option>Pop</option><option>Blues, Soul & R&B</option>
        <option>Country & Americana</option><option>Soundtracks & Compilations</option>
        <option>Musicals & Broadway</option><option>Comedy / Spoken Word</option>
        <option>Needs Review</option>
      </select>
      <div class="genre-auto" id="genreMsg"></div>
    </div>
    <div class="field"><label>Double CD?</label>
      <select id="fDouble">
        <option value="No">No — single disc ($5)</option>
        <option value="Yes">Yes — double disc ($8)</option>
      </select>
    </div>
    <div class="field"><label>Notes</label>
      <input type="text" id="fNotes" placeholder="Optional"></div>
    <button class="btn-save" id="saveBtn" onclick="saveCD()">Save to Inventory</button>
    <button class="btn-clear" onclick="clearForm()">Clear / Next CD</button>
  </div>

  <button class="btn-debug" onclick="toggleDebug()">Toggle Debug</button>
  <div class="debug-box" id="debugBox">
    <div style="color:var(--gold);font-weight:bold;margin-bottom:8px;">Debug</div>
    <div id="dbgLib">Library: checking…</div>
    <div id="dbgCam">Camera: not started</div>
    <div id="dbgFrames">Frames decoded: 0</div>
    <div id="dbgErr">Last error: —</div>
    <div id="dbgResult">Last barcode: —</div>
  </div>

  <div id="historySection" style="display:none;">
    <div class="section-title">This session (<span id="historyCount">0</span> CDs)</div>
    <div id="historyList"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlV39-rraFAIklwGv3K0u3FZj28v2dAYMZN2FrRbHg6japGuzrS-xpXCfDE8Q3yxWN/exec';
const S = { log:[], count:0, scanning:false, genreTimer:null, frameCount:0, animFrame:null };

function toggleDebug() {
  document.getElementById('debugBox').classList.toggle('show');
  checkLib();
}

function checkLib() {
  const lib = getLib();
  document.getElementById('dbgLib').textContent = lib
    ? 'Library: ✓ ' + (window.ZXingBrowser ? 'ZXingBrowser' : window.ZXing ? 'ZXing' : 'unknown')
    : 'Library: ✗ NOT LOADED';
}

function getLib() {
  return window.ZXingBrowser || window.ZXing || null;
}

async function api(action, data) {
  try {
    const r = await fetch(SCRIPT_URL, { method:'POST', body:JSON.stringify({ action, ...data }) });
    return await r.json();
  } catch(e) { return { error: e.toString() }; }
}

// ── LOAD ZXING DYNAMICALLY ─────────────────────────────────
function loadZXing() {
  return new Promise((resolve, reject) => {
    if (getLib()) { resolve(getLib()); return; }
    const s = document.createElement('script');
    // Try Quagga as fallback barcode library - more mobile friendly
    s.src = 'https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js';
    s.onload = () => resolve('quagga');
    s.onerror = () => {
      // Try ZXing from different CDN
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/umd/index.min.js';
      s2.onload = () => resolve(window.ZXingBrowser || 'zxing-browser');
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
}

// ── CAMERA ────────────────────────────────────────────────
async function startCamera() {
  document.getElementById('scanStatus').textContent = 'Starting…';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }
    });
    const video = document.getElementById('preview');
    video.srcObject = stream;
    await video.play();
    document.getElementById('startOverlay').style.display = 'none';
    const w = video.videoWidth, h = video.videoHeight;
    document.getElementById('dbgCam').textContent = `Camera: ${w}x${h}`;
    document.getElementById('scanStatus').textContent = 'Loading scanner…';

    // Load Quagga (mobile-optimized barcode lib)
    const libResult = await loadZXing();
    document.getElementById('dbgLib').textContent = 'Library: ✓ ' + libResult;

    if (window.Quagga) {
      startQuagga(video, stream);
    } else if (window.ZXingBrowser) {
      startZXingBrowser(video);
    } else {
      // Manual canvas loop as last resort
      startManualLoop(video);
    }

  } catch(e) {
    document.getElementById('scanStatus').textContent = 'Camera error: ' + e.message;
    document.getElementById('dbgCam').textContent = 'Error: ' + e.message;
  }
}

// ── QUAGGA (most mobile-friendly) ─────────────────────────
function startQuagga(video, stream) {
  document.getElementById('scanStatus').textContent = 'Scanning — align barcode…';
  S.scanning = true;

  Quagga.init({
    inputStream: {
      type: 'LiveStream',
      target: video,
      constraints: { facingMode: 'environment' }
    },
    decoder: {
      readers: ['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader']
    },
    locate: true,
  }, (err) => {
    if (err) {
      document.getElementById('dbgErr').textContent = 'Quagga init error: ' + err;
      startManualLoop(video);
      return;
    }
    Quagga.start();
    Quagga.onDetected((data) => {
      if (!S.scanning) return;
      const code = data.codeResult.code;
      document.getElementById('dbgResult').textContent = 'Barcode: ' + code;
      Quagga.stop();
      onBarcode(code);
    });
  });
}

// ── ZXING BROWSER ─────────────────────────────────────────
function startZXingBrowser(video) {
  document.getElementById('scanStatus').textContent = 'Scanning — align barcode…';
  S.scanning = true;
  const reader = new ZXingBrowser.BrowserMultiFormatReader();
  reader.decodeFromVideoElement(video, (result, err) => {
    if (result && S.scanning) {
      document.getElementById('dbgResult').textContent = 'Barcode: ' + result.getText();
      onBarcode(result.getText());
    }
    if (err && err.name !== 'NotFoundException') {
      document.getElementById('dbgErr').textContent = err.message;
    }
  });
}

// ── MANUAL CANVAS LOOP (fallback) ─────────────────────────
function startManualLoop(video) {
  document.getElementById('scanStatus').textContent = 'Scanning (manual mode)…';
  document.getElementById('dbgLib').textContent = 'Library: manual canvas — no decode lib loaded';
  // Without a decode library we can't read barcodes
  // Show manual entry prominently
  document.getElementById('scanStatus').textContent = 'Use manual entry below — library failed to load';
  S.scanning = false;
}

function onBarcode(barcode) {
  if (!S.scanning) return;
  S.scanning = false;
  document.getElementById('flash').classList.add('show');
  setTimeout(() => document.getElementById('flash').classList.remove('show'), 300);
  document.getElementById('scanStatus').textContent = 'Read: ' + barcode;
  doLookup(barcode);
}

// ── LOOKUP ─────────────────────────────────────────────────
async function doLookup(barcode) {
  barcode = (barcode||'').trim().replace(/\D/g,'');
  if (!barcode) return;
  document.getElementById('barcodeInput').value = barcode;
  setStatus('<span class="spin"></span> Looking up ' + barcode + '…', '');
  showForm(false);
  try {
    const res = await fetch(
      `https://musicbrainz.org/ws/2/release/?query=barcode:${barcode}&fmt=json&limit=1`,
      { headers:{ 'User-Agent':'GrooveGarage/1.0 (groove@groovegarage.local)' }}
    );
    const data = await res.json();
    if (data.releases && data.releases.length > 0) {
      const rel    = data.releases[0];
      const artist = rel['artist-credit']?.[0]?.artist?.name || '';
      document.getElementById('fArtist').value = artist;
      document.getElementById('fTitle').value  = rel.title || '';
      document.getElementById('fLabel').value  = rel['label-info']?.[0]?.label?.name || '';
      document.getElementById('fYear').value   = rel.date ? rel.date.substring(0,4) : '';
      setStatus('✓ Found: ' + artist + ' — ' + (rel.title||''), 'found');
      if (artist) autoGenre(artist);
    } else {
      setStatus('Not found — fill in details below', 'notfound');
    }
  } catch(e) { setStatus('Lookup failed — fill in manually', 'notfound'); }
  showForm(true);
}

async function autoGenre(artist) {
  const res = await api('lookupGenre', { artist });
  if (res.genre) {
    document.getElementById('fGenre').value = res.genre;
    document.getElementById('genreMsg').textContent =
      res.genre !== 'Needs Review' ? '✓ Auto-detected' : '⚠ Please select genre';
  }
}

function triggerGenre() {
  clearTimeout(S.genreTimer);
  S.genreTimer = setTimeout(() => {
    const a = document.getElementById('fArtist').value.trim();
    if (a.length > 2) autoGenre(a);
  }, 700);
}

async function saveCD() {
  const artist = document.getElementById('fArtist').value.trim();
  const title  = document.getElementById('fTitle').value.trim();
  if (!artist || !title) { showToast('Artist and Title required', true); return; }
  const btn = document.getElementById('saveBtn');
  btn.classList.add('saving'); btn.textContent = '⏳ Saving…';
  const res = await api('addCD', { data:{
    artist, title,
    label:    document.getElementById('fLabel').value.trim(),
    year:     document.getElementById('fYear').value,
    genre:    document.getElementById('fGenre').value,
    doubleCD: document.getElementById('fDouble').value,
    notes:    document.getElementById('fNotes').value.trim(),
  }});
  btn.classList.remove('saving'); btn.textContent = 'Save to Inventory';
  if (res.success) {
    const msg = res.action === 'incremented'
      ? `+1 copy · ${artist} · now ${res.newQty} in stock`
      : `Saved · ${artist} — ${title}`;
    showToast(msg);
    S.count++;
    S.log.unshift({ artist, title,
      genre:  document.getElementById('fGenre').value,
      double: document.getElementById('fDouble').value,
      action: res.action||'new', newQty: res.newQty||1,
      time:   new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
    });
    document.getElementById('sessionCount').textContent = S.count;
    renderHistory();
    clearForm();
    S.scanning = true;
    document.getElementById('scanStatus').textContent = 'Scanning — align barcode…';
  } else {
    showToast('Save failed: ' + (res.error||'unknown'), true);
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  el.innerHTML = msg;
  el.className = 'status-bar show' + (type?' '+type:'');
}
function showForm(show) {
  document.getElementById('formCard').className = 'form-card' + (show?' show':'');
}
function clearForm() {
  ['fArtist','fTitle','fLabel','fYear','fNotes','barcodeInput'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('fGenre').value='';
  document.getElementById('fDouble').value='No';
  document.getElementById('genreMsg').textContent='';
  setStatus('Ready — align barcode in frame','');
  showForm(false);
  window.scrollTo(0,0);
}
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(isError?' error':'');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function renderHistory() {
  const sec = document.getElementById('historySection');
  sec.style.display = S.log.length ? 'block' : 'none';
  document.getElementById('historyCount').textContent = S.count;
  document.getElementById('historyList').innerHTML = S.log.map(item=>`
    <div class="history-card">
      <div class="history-artist">${esc(item.artist)}</div>
      <div class="history-title">${esc(item.title)}</div>
      <div class="history-meta">
        <span>${esc(item.genre||'—')}</span>
        ${item.double==='Yes'?'<span style="color:var(--gold);">2xCD</span>':''}
        <span style="color:${item.action==='incremented'?'var(--gold)':'var(--green)'}">
          ${item.action==='incremented'?'qty now '+item.newQty:'new entry'}
        </span>
        <span style="margin-left:auto;">${item.time}</span>
      </div>
    </div>`).join('');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
